[project]
name = "canvas-mcp"
version = "0.1.0"
description = "MCP server for Canvas LMS — manage courses, assignments, modules, and more from any MCP client"
readme = "README.md"
license = {text = "MIT-0"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
canvas-mcp = "canvas_mcp.server:main"
